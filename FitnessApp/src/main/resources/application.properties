spring.application.name=FitnessApp

#1. Database configuration
spring.datasource.url=jdbc:mysql://localhost:3306/fitness_db
spring.datasource.username=root
spring.datasource.password=Gagan@123

#2. JPA/Hibernate configuration

#Updates tables on every run
spring.jpa.hibernate.ddl-auto=update

#Generates SQL queries that are compatible with MySQL(Optional line as spring boot automatically detects it)
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

#Good practice for REST APIs, Disables session during view rendering, Prevents lazy loading issues in controllers
spring.jpa.open-in-view=false

#Makes SQL readable(Better format)
spring.jpa.properties.hibernate.format_sql=true

#Logs all SQL queries generated by Hibernate.
logging.level.org.hibernate.SQL=DEBUG

#Logs the actual values (parameters) bound to those SQL queries.
logging.level.org.hibernate.type.descriptor.sql=TRACE

